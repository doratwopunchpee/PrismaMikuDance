name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Syntax-check all ES6 modules
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate Capacitor config
        run: npx cap doctor || true

  build-android:
    name: Build Android (debug APK)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm run build:web
      - run: npx cap add android
      - run: npx cap sync android
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: prismamd-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  # iOS build stays commented out — it needs a macos-14 runner (billed at a
  # higher per-minute rate on GitHub-hosted runners) and code-signing setup
